<!DOCTYPE html>
<html>
    <head>
        <style>
            .wrap{
                width:400px;
                display:flex;
                flex-direction:row-reverse;
                gap:80px;
                border:1px solid #000;
                padding:10px;
            }
            .wrap div{
                width: 60px;
                height:60px;
                background:skyblue;
                text-align: center;
                line-height: 60px;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div>A</div>
            <div>B</div>
            <div>C</div>
        </div>
    </body>
</html>
