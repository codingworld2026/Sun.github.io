<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>JS四个弹窗/控制台函数演示</title>
    </head>
<body>
    <p>拖动浏览器窗口大小，看控制台输出</p>
    <button id="btn">点击测试BOM弹窗和刷新</button>
    //<button id="goBaidu">跳转百度</button>
    <button id="goBack">后退回去</button>
    <script>
        console.log("浏览器窗口宽度：",window.innerWidth);
        console.log("浏览器窗口高度：",window.innerHeight);
        console.log("===程序开始运行===");

        alert("欢迎测试JS常用弹窗函数！");
        window.prompt("善意提醒","hello");
        let result=prompt("你爱吃什么水果","苹果");
        console.log(result);
        //prompt();
        let userName=window.prompt("请输入你的名字：","name");
        console.log("用户输入的名字：",userName);
        //confirm();
        //点击确定返回true，点击取消返回false;
        window.confirm("明天会更好")
        let islearnJs=confirm("你是否打算继续学习JavaScript？");
        console.log("用户是否愿意继续学习JS：",islearnJs);
        if(islearnJs){
            alert(userName+"好的，请继续坚持学习前端！");
            console.log(userName+"选择继续学习JavaScript");
        }
        else{
            alert("没关系，以后有空学习也可以");
            console.log(userName+"暂时不继续学习");
        }
        const pi=3.1415;
        console.log(pi);
        let user="张三";
        console.log(typeof user);
        let flag=confirm("继续学习？");
        console.log(typeof flag);
        let num=100;
        console.log(typeof num);
        let empty=null;
        console.log(typeof empty);

        //BOM弹窗
        alert("这是纯净的没有window的BOM弹窗");//弹窗警告
        window.onload=function(){console.log("BOM事件：整个窗口资源加载完毕");};
        //BOM控制页面跳转/刷新
        //window.location.href="https://www.baidu.com";//跳转网页
        //window.location.reload();//刷新当前页面
        //window.history.back();//BOM浏览历史，浏览器后退一页
        //window.addEventListener("resize",function()
        //{console.log("窗口尺寸变了，新宽度：",widow.innerWidth);})
        document.getElementById("btn").onclick=function(){
           window.alert("这是BOM弹窗");
            window.location.href="https://www.baidu.com";
            //window.location.reload();
           //window.history.back();
        }
        document.getElementById("goBaidu").onclick=function(){
            window.location.href="https://www.baidu.com";
           window.open("https://www.baidu.com",);
        }
        //document.getElmentByid("goBack").onclick=function(){
          //window.history.back();
        //}
    </script>
    
</body>
</html>
