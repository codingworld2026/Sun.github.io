<!DOCTYPE html>
<html>
    <head>
    <title>Grid Layout Example</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 100px 200px 150px;/*定义列*/
            grid-template-rows: 50px 100px;/*定义行*/
            gap: 10px;/*定义间距*/
        }
        .item1,.item2,.item3,.item4,.item5,.item6{
            background-color: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
        }
        .item1{
            grid-column: 1/3;
            grid-row: 1;
        }
        .item2{
            grid-column: 2/4;
            grid-row: 2;
        }
        .item3{
            grid-column: 1;
            grid-row: 2/4;
        }
        .item4{
            grid-column:3;
            grid-row:1/3;
        }
        .item5{
            grid-column: 2;
            grid-row:3;
        }
        .item6{
            grid-column:1/4;
            grid-row:4;
        }
        .grid-exercise{
            margin:0;
            padding:10;
            box-sizing: border-box;
            display:grid;
            width: 700px;
            height:320px;
            border:5px solid #d61313;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: 2fr 2fr;
            gap: 20px;
        }
        .grid-exercise div[class^="item-"]{
            background-color: aqua;
           
        }
       
        
    </style>
    </head>
    <body>
        <div class="grid-container">
            <div class="item1">Item 1</div>
            <div class="item2">Item 2</div>
            <div class="item3">Item 3</div>
            <div class="item4">Item 4</div>
            <div class="item5">Item 5</div>
            <div class="item6">Item 6</div>
        </div>
        <div class="grid-exercise">
            <div class="item-a">item a</div>
            <div class="item-b">item b</div>
            <div class="item-c">item c</div>
            <div class="item-d">item d</div>
            <div class="item-e">item e</div>
            <div class="item-f">item f</div>
            <div class="item-g">item g</div>
            <div class="item-h">item h</div>
        </div>
    </body>
</html>
